<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Welcome to {{appName}}</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				line-height: 1.6;
				color: #333;
				max-width: 600px;
				margin: 0 auto;
				padding: 20px;
			}
			.container {
				background: #f9f9f9;
				padding: 20px;
				border-radius: 8px;
			}
			h1 {
				color: #2c3e50;
			}
			p {
				margin: 10px 0;
			}
			.signature {
				margin-top: 20px;
				font-style: italic;
				color: #666;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<h1>Welcome, {{name}}!</h1>
			<p>Thank you for joining {{appName}}.</p>
			<p>We're excited to have you on board!</p>
			<p class="signature">The {{appName}} Team</p>
		</div>
	</body>
</html>
